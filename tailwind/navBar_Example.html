<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Detached Nav — MVP</title>
  <style>
    :root{
      --bg:#0f1724; /* page bg */
      --nav:#0b1220; /* nav bg */
      --accent:#dba94b; /* classy gold */
      --muted:#98a0b3;
      --glass: rgba(255,255,255,0.04);
      --radius:28px;
      --gap:28px;
      --shadow: 0 10px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }
    html,body{height:100%;}
    body{
      margin:0; background:linear-gradient(180deg,var(--bg) 0%, #071025 100%); color:#e6eef8; -webkit-font-smoothing:antialiased; display:flex; align-items:flex-start; justify-content:center; padding:48px;
    }

    /* Container gives the look of being detached from top */
    .nav-shell{
      width:min(1100px,96%);
      margin-top:40px; /* the 'detached' gap */
    }

    .brand-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}

    nav.detached{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius: var(--radius);
      padding:14px 20px;
      display:flex; align-items:center; justify-content:space-between; gap:18px;
      box-shadow:var(--shadow);
      border:1px solid rgba(255,255,255,0.03);
      backdrop-filter: blur(6px);
    }

    .logo{
      display:flex; align-items:center; gap:12px; font-weight:700; letter-spacing:0.6px;
    }
    .logo .sig{
      width:44px; height:44px; border-radius:10px; background:linear-gradient(135deg,var(--accent),#ffc06a); display:grid; place-items:center; color:#071025; font-weight:800;
      box-shadow:0 6px 18px rgba(219,169,75,0.12);
    }
    .logo .name{font-size:18px;}

    /* Main nav links */
    .links{display:flex; gap:18px; align-items:center}
    .links a{
      text-decoration:none; color:var(--muted); padding:8px 12px; border-radius:12px; font-weight:600; font-size:15px;
      transition: all .18s ease;
    }
    .links a:hover{color:var(--accent); transform:translateY(-3px);}
    .cta{background:linear-gradient(90deg,var(--accent),#ffcb7d); color:#071025; padding:10px 14px; border-radius:14px; font-weight:800; box-shadow:0 6px 20px rgba(219,169,75,0.12);}

    /* Rounded ends feel bigger on wide screens */
    .detached{border-top-left-radius:calc(var(--radius)); border-bottom-left-radius:calc(var(--radius)); border-top-right-radius:calc(var(--radius)); border-bottom-right-radius:calc(var(--radius));}

    /* Mobile */
    .burger{display:none; background:none; border:0; color:var(--muted); font-size:18px}
    @media (max-width:820px){
      .links{display:none}
      .burger{display:block}
      nav.detached{padding:10px 12px}
    }

    /* subtle hero area to display how detached it sits on the page */
    .hero{
      margin-top:36px; padding:38px; border-radius:20px; background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00)); border:1px solid rgba(255,255,255,0.02);
      box-shadow: 0 18px 60px rgba(2,6,23,0.65);
    }

    /* small accessibility focus states */
    a:focus{outline:3px solid rgba(219,169,75,0.12); outline-offset:4px}

  </style>
</head>
<body>
  <div class="nav-shell">
    <nav class="detached" role="navigation" aria-label="Main">
      <div class="logo" aria-hidden="false">
        <div class="sig">TS</div>
        <div class="name">SHELBY CO.</div>
      </div>

      <div class="links" id="links">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#work">Work</a>
        <a href="#contact">Contact</a>
        <a class="cta" href="#apply">Apply</a>
      </div>

      <button class="burger" id="burger" aria-expanded="false" aria-controls="mobile-menu">☰</button>
    </nav>

    <section class="hero">
      <h1 style="margin:0 0 12px 0; font-size:20px;">Detached nav — MVP</h1>
      <p style="margin:0; color:var(--muted)">This demonstrates the "not touching the top" nav with rounded ends, bold presence, and a classy accent. Resize to see mobile behavior.</p>
    </section>
  </div>

  <script>
    // small mobile toggle
    const burger = document.getElementById('burger');
    const links = document.getElementById('links');
    burger?.addEventListener('click', ()=>{
      const opened = burger.getAttribute('aria-expanded') === 'true';
      burger.setAttribute('aria-expanded', String(!opened));
      if(!opened){
        links.style.display = 'flex';
        links.style.flexDirection = 'column';
        links.style.position = 'absolute';
        links.style.right = '20px';
        links.style.top = '74px';
        links.style.background = 'var(--nav)';
        links.style.padding = '12px';
        links.style.borderRadius = '12px';
        links.style.boxShadow = '0 12px 30px rgba(2,6,23,0.6)';
      } else {
        links.style.display = '';
        links.style.position = '';
        links.style.flexDirection = '';
        links.style.top = '';
        links.style.right = '';
        links.style.background = '';
        links.style.padding = '';
        links.style.borderRadius = '';
        links.style.boxShadow = '';
      }
    });
  </script>
</body>
</html>
